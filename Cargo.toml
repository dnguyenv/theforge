[workspace]
resolver = "2"
exclude = ["crates/forge-wasm-bridge"]
members = [
    "crates/anvil-core",
    "crates/anvil-event-bus",
    "crates/forge-observer",
    "crates/forge-crypto",
    "crates/forge-merkle",
    "crates/forge-session",
    "crates/forge-storage",
    "crates/armorer-core",
    "crates/beskar-export",
    "crates/foundry-sync",
    "crates/forge-wasm-sdk",
    "crates/anvil-plugin-host",
    "crates/forge-verifier",
    "tools/forge-cli",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
