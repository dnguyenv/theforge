<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>An Tam Art — Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="toolbar-top">
            <div class="toolbar-left">
                <span class="app-title">An Tam Art</span>
                <div id="tool-buttons"></div>
            </div>
            <div class="toolbar-center">
                <label class="slider-group">
                    <span>Size</span>
                    <input type="range" id="brush-size" min="1" max="200" value="12">
                    <span id="size-value">12</span>
                </label>
                <label class="slider-group">
                    <span>Opacity</span>
                    <input type="range" id="brush-opacity" min="1" max="100" value="100">
                    <span id="opacity-value">100%</span>
                </label>
            </div>
            <div class="toolbar-right">
                <button id="btn-zoom-in" title="Zoom In (+)">+</button>
                <button id="btn-zoom-out" title="Zoom Out (-)">−</button>
                <button id="btn-fit" title="Fit to Screen">⊡</button>
                <label class="bg-color-label" title="Canvas Background">
                    <input type="color" id="canvas-bg-color" value="#ffffff">
                </label>
                <button id="btn-undo" title="Undo (Ctrl+Z)">↩</button>
                <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">↪</button>
                <button id="btn-analyze" title="Analyze Purity">⚗️</button>
                <button id="btn-export" title="Export Beskar">⬇️</button>
                <button id="btn-fullscreen" title="Fullscreen">⛶</button>
            </div>
        </div>

        <div id="main-content">
            <aside id="panel-left" class="panel">
                <div id="brush-library"></div>
                <div id="color-picker-container"></div>
            </aside>

            <div id="canvas-viewport">
                <canvas id="forge-canvas"></canvas>
                <button id="btn-exit-fullscreen" title="Exit Fullscreen (F)">✕</button>
            </div>

            <aside id="panel-right" class="panel">
                <div id="layers-panel"></div>
            </aside>
        </div>

        <div id="status-bar-container"></div>

        <div id="modal-overlay" hidden>
            <div id="modal-content">
                <button id="modal-close">✕</button>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
