<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>An Tam Art — Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="toolbar-top">
            <div class="toolbar-left">
                <span class="app-title">An Tam Art</span>
                <div id="tool-buttons"></div>
            </div>
            <div class="toolbar-center">
                <label class="slider-group">
                    <span>Size</span>
                    <input type="range" id="brush-size" min="1" max="200" value="12">
                    <span id="size-value">12</span>
                </label>
                <label class="slider-group">
                    <span>Opacity</span>
                    <input type="range" id="brush-opacity" min="1" max="100" value="100">
                    <span id="opacity-value">100%</span>
                </label>
            </div>
            <div class="toolbar-right">
                <button id="btn-undo" title="Undo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h10a5 5 0 015 5v0a5 5 0 01-5 5H8M3 10l4-4M3 10l4 4"/></svg></button>
                <button id="btn-redo" title="Redo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10H11a5 5 0 00-5 5v0a5 5 0 005 5h5M21 10l-4-4M21 10l-4 4"/></svg></button>
                <div id="collab-panel-container"></div>
                <div class="toolbar-overflow">
                    <button id="btn-more" class="btn-more" title="More"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
                    <div id="overflow-menu" class="overflow-menu" hidden>
                        <button id="btn-zoom-in" title="Zoom In"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M8 11h6M11 8v6"/></svg></button>
                        <button id="btn-zoom-out" title="Zoom Out"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M8 11h6"/></svg></button>
                        <button id="btn-fit" title="Fit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14v4h4M20 14v4h-4M4 10V6h4M20 10V6h-4"/></svg></button>
                        <div class="menu-divider"></div>
                        <label class="menu-color-row" title="Background"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><input type="color" id="canvas-bg-color" value="#ffffff"></label>
                        <div class="menu-divider"></div>
                        <button id="btn-analyze" title="Analyze"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3v9l-4 8h14l-4-8V3M8 3h8"/></svg></button>
                        <button id="btn-export" title="Export"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M12 15l-4-4M12 15l4-4M4 17v2h16v-2"/></svg></button>
                        <div class="menu-divider"></div>
                        <button id="btn-fullscreen" title="Fullscreen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h5M4 4v5M20 4h-5M20 4v5M4 20h5M4 20v-5M20 20h-5M20 20v-5"/></svg></button>
                    </div>
                </div>
            </div>
        </div>

        <div id="main-content">
            <aside id="panel-left" class="panel">
                <div id="brush-library"></div>
                <div id="color-picker-container"></div>
            </aside>

            <div id="canvas-viewport">
                <canvas id="forge-canvas"></canvas>
                <button id="btn-exit-fullscreen" title="Exit Fullscreen (F)">✕</button>
            </div>

            <aside id="panel-right" class="panel">
                <div id="layers-panel"></div>
            </aside>
        </div>

        <div id="status-bar-container"></div>

        <div id="modal-overlay" hidden>
            <div id="modal-content">
                <button id="modal-close">✕</button>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
